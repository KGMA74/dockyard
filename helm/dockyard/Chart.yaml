apiVersion: v2
name: dockyard
description: A self-hosted Docker Registry V2 server
type: application
version: 0.7.2
appVersion: "0.7.2"
keywords:
  - docker
  - registry
  - container
home: https://github.com/kgma74/dockyard
icon: https://raw.githubusercontent.com/KGMA74/dockyard/main/assets/brand/dockyard-app-icon.svg
sources:
  - https://github.com/kgma74/dockyard
maintainers:
  - name: KGMA74
    email: marmelkambou2@gmail.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: storage
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/kgma74/dockyard
  artifacthub.io/screenshots: |
    - title: Overview — counts, recent pushes, registry status, ready-to-copy docker commands
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/overview-en-light.png
    - title: Images list
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/images-list.jpg
    - title: Image details — layers, size, signature status
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/image-details.jpg
    - title: Storage insights — growth history and largest repositories
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/storage-insights.jpg
  # Kept by .github/workflows/helm-release.yml when `version` above matches the
  # tag being released (a hand-written changelog). Otherwise the workflow
  # overwrites it from the GitHub release notes of that tag.
  artifacthub.io/changes: |
    - kind: fixed
      description: Scans of Java images failed because the scanner token was sent to every registry, so ghcr.io refused the Java DB download (DENIED invalid token); the token now goes to Dockyard alone, through a private per-scan DOCKER_CONFIG removed when trivy exits
    - kind: fixed
      description: Trivy failed with "stat /tmp no such file or directory" in the scratch image; its TMPDIR is now a directory on the cache volume, and the image has a /tmp for running trivy by hand
    - kind: changed
      description: Scans never download a database; Dockyard refreshes the vulnerability DB and the Java DB itself, without credentials, at startup and every 12 hours (the Java DB is ~1 GB, size the volume for it)
    - kind: added
      description: Build argument TRIVY_JAVA_DB=true ships the Java DB in the image for air-gapped installs; databases baked into the image are seeded into a cache that lacks them
  artifacthub.io/images: |
    - name: dockyard
      image: ghcr.io/kgma74/dockyard:0.7.2
