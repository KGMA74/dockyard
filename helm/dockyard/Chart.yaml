name: dockyard
description: A self-hosted Docker Registry V2 server
type: application
version: 0.7.1
appVersion: "0.7.1"
keywords:
  - docker
  - registry
  - container
home: https://github.com/kgma74/dockyard
icon: https://raw.githubusercontent.com/KGMA74/dockyard/main/assets/brand/dockyard-app-icon.svg
sources:
  - https://github.com/kgma74/dockyard
maintainers:
  - name: KGMA74
    email: marmelkambou2@gmail.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: storage
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/kgma74/dockyard
  artifacthub.io/screenshots: |
    - title: Images list
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/images-list.jpg
    - title: Image details — layers, size, signature status
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/image-details.jpg
    - title: Storage insights — growth history and largest repositories
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/storage-insights.jpg
  # Kept by .github/workflows/helm-release.yml when `version` above matches the
  # tag being released (a hand-written changelog). Otherwise the workflow
  # overwrites it from the GitHub release notes of that tag.
  artifacthub.io/changes: |
    - kind: fixed
      description: Vulnerability scans failed with 401 Unauthorized when registry auth was on (V2_AUTH_ENABLED=true) and anonymous pull off; trivy now pulls with a token of its own, nothing to configure
    - kind: security
      description: The scanner token is short-lived (SCAN_TIMEOUT + 1 minute), pull only and limited to the scanned repository; it is passed to trivy in its environment, never on the command line, in logs or in stored reports
    - kind: security
      description: Trivy runs with an explicit, minimal environment (PATH, proxy and CA variables) instead of inheriting all of Dockyard's, JWT_SECRET included
    - kind: changed
      description: The scanner no longer has a per-process password for /v2; a scan that still gets a 401 says whether trivy had a token
  artifacthub.io/images: |
    - name: dockyard
      image: ghcr.io/kgma74/dockyard:0.7.1
