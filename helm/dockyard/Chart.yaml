apiVersion: v2
name: dockyard
description: A self-hosted Docker Registry V2 server
type: application
version: 0.9.0
appVersion: "0.9.0"
keywords:
  - docker
  - registry
  - container
home: https://github.com/kgma74/dockyard
icon: https://raw.githubusercontent.com/KGMA74/dockyard/main/assets/brand/dockyard-app-icon.svg
sources:
  - https://github.com/kgma74/dockyard
maintainers:
  - name: KGMA74
    email: marmelkambou2@gmail.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: storage
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/kgma74/dockyard
  artifacthub.io/screenshots: |
    - title: Overview — counts, recent pushes, registry status, ready-to-copy docker commands
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/overview-en-light.png
    - title: Images list
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/images-list.jpg
    - title: Image details — layers, size, signature status
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/image-details.jpg
    - title: Storage insights — growth history and largest repositories
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/storage-insights.jpg
  # Kept by .github/workflows/helm-release.yml when `version` above matches the
  # tag being released (a hand-written changelog). Otherwise the workflow
  # overwrites it from the GitHub release notes of that tag.
  artifacthub.io/changes: |
    - kind: added
      description: A Vulnerabilities page for the whole registry — every scanned image by risk with its pull-blocked status and report, and the CVEs found in the most images (click one to see the images it affects), backed by GET /api/admin/vulnerabilities
    - kind: added
      description: A getting-started checklist for admins of a new install (admin password, first image, robot account for CI, scan on push, team, HTTPS), each step ticked from the server state and linked to where it is done, backed by GET /api/admin/setup
    - kind: added
      description: On a repository page, scan an unscanned tag (or every unscanned tag) in one click, open a tag report from its vulnerability counts, and copy pull commands for docker, podman or Kubernetes (with the image pull secret)
    - kind: changed
      description: On small screens the size and vulnerabilities of each tag show under its name, where the columns are hidden
    - kind: fixed
      description: With several console tabs open over plain HTTP, the seventh tab and beyond never loaded (each tab held a live-update connection and browsers allow six per host); one connection is now shared by all tabs
    - kind: fixed
      description: A finished scan now refreshes the tag list too, so its vulnerability badges update without a reload
  artifacthub.io/images: |
    - name: dockyard
      image: ghcr.io/kgma74/dockyard:0.9.0
