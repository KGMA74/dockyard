apiVersion: v2
name: dockyard
description: A self-hosted Docker Registry V2 server
type: application
version: 0.8.0
appVersion: "0.8.0"
keywords:
  - docker
  - registry
  - container
home: https://github.com/kgma74/dockyard
icon: https://raw.githubusercontent.com/KGMA74/dockyard/main/assets/brand/dockyard-app-icon.svg
sources:
  - https://github.com/kgma74/dockyard
maintainers:
  - name: KGMA74
    email: marmelkambou2@gmail.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: storage
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/kgma74/dockyard
  artifacthub.io/screenshots: |
    - title: Overview — counts, recent pushes, registry status, ready-to-copy docker commands
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/overview-en-light.png
    - title: Images list
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/images-list.jpg
    - title: Image details — layers, size, signature status
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/image-details.jpg
    - title: Storage insights — growth history and largest repositories
      url: https://raw.githubusercontent.com/kgma74/dockyard/main/assets/screenshots/storage-insights.jpg
  # Kept by .github/workflows/helm-release.yml when `version` above matches the
  # tag being released (a hand-written changelog). Otherwise the workflow
  # overwrites it from the GitHub release notes of that tag.
  artifacthub.io/changes: |
    - kind: added
      description: Download a scan's vulnerability report as PDF (to share, in English or French), CSV (for a spreadsheet) or JSON (raw Trivy report), from the report window or GET /api/admin/scans/{id}/report?format=pdf|csv|json
    - kind: security
      description: Report responses are never cached (Cache-Control no-store), each export is recorded in the audit log, and CSV cells that would run as spreadsheet formulas are neutralized
    - kind: changed
      description: The Terraform module rejects replica_count other than 1 and autoscaling_enabled (the chart refuses both since 0.6.0) with a clear message, and its S3 lifecycle rule no longer triggers the AWS provider's deprecation warning
    - kind: changed
      description: Documentation brought up to date — every admin endpoint in API.md, all settings in CONFIGURATION.md (TRUSTED_PROXIES, V2_ANONYMOUS_PULL, TRIVY_DB_SEED_DIR), mirror mode and Trivy databases in the chart README, Go 1.26 prerequisite
    - kind: changed
      description: Dependency updates — go-jose 4.1.6 (used by single sign-on)
  artifacthub.io/images: |
    - name: dockyard
      image: ghcr.io/kgma74/dockyard:0.8.0
