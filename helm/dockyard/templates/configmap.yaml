apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dockyard.fullname" . }}
  labels:
    {{- include "dockyard.labels" . | nindent 4 }}
data:
  PORT: "8080"
  REGISTRY_MODE: {{ .Values.registry.mode | quote }}
  REGISTRY_STORAGE_BACKEND: {{ .Values.registry.storage.backend | quote }}
  REGISTRY_STORAGE_PATH: {{ .Values.registry.storage.path | quote }}
  S3_ENDPOINT: {{ .Values.registry.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.registry.s3.bucket | quote }}
  S3_REGION: {{ .Values.registry.s3.region | quote }}
  S3_SECURE: {{ .Values.registry.s3.secure | quote }}
  AUTH_USERNAME: {{ .Values.auth.username | quote }}
  V2_AUTH_ENABLED: {{ .Values.auth.v2Enabled | toString | quote }}
  V2_ANONYMOUS_PULL: {{ .Values.auth.v2AnonymousPull | default false | toString | quote }}
  REGISTRY_URL: {{ .Values.registry.proxy.url | quote }}
  REGISTRY_USERNAME: {{ .Values.registry.proxy.username | quote }}
  TLS_MODE: {{ (.Values.tls).mode | default "off" | quote }}
  TLS_DOMAIN: {{ (.Values.tls).domain | default "" | quote }}
  TLS_ACME_EMAIL: {{ (.Values.tls).acmeEmail | default "" | quote }}
  {{- if (.Values.tls).existingCertSecret }}
  TLS_CERT_FILE: "/etc/dockyard-tls/tls.crt"
  TLS_KEY_FILE: "/etc/dockyard-tls/tls.key"
  {{- end }}
  {{- if (.Values.tracing).otlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}
  {{- end }}
  SCAN_ENABLED: {{ (.Values.scan).enabled | default false | toString | quote }}
  TRIVY_SERVER_URL: {{ (.Values.scan).trivyServerURL | default "" | quote }}
  TRIVY_OFFLINE: {{ (.Values.scan).offline | default false | toString | quote }}
  {{- if (.Values.scan).cacheDir }}
  TRIVY_CACHE_DIR: {{ .Values.scan.cacheDir | quote }}
  {{- end }}
  SCAN_TIMEOUT: {{ (.Values.scan).timeout | default "5m" | quote }}
  SCAN_MAX_REPORT_BYTES: {{ (.Values.scan).maxReportBytes | default 20971520 | quote }}
  SCAN_DEDUP_WINDOW: {{ (.Values.scan).dedupWindow | default "1h" | quote }}
  TRIVY_INSECURE_REGISTRY: {{ (.Values.scan).insecureRegistry | default true | toString | quote }}
  {{- if (.Values.oidc).enabled }}
  {{- if not .Values.oidc.issuerURL }}
  {{- fail "oidc.enabled requires oidc.issuerURL" }}
  {{- end }}
  {{- if not .Values.oidc.clientID }}
  {{- fail "oidc.enabled requires oidc.clientID" }}
  {{- end }}
  OIDC_ISSUER_URL: {{ .Values.oidc.issuerURL | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientID | quote }}
  OIDC_REDIRECT_URL: {{ .Values.oidc.redirectURL | default "" | quote }}
  OIDC_DISPLAY_NAME: {{ .Values.oidc.displayName | default "SSO" | quote }}
  OIDC_SCOPES: {{ join "," (.Values.oidc.scopes | default (list "openid" "profile" "email")) | quote }}
  OIDC_USERNAME_CLAIM: {{ .Values.oidc.usernameClaim | default "preferred_username" | quote }}
  OIDC_GROUPS_CLAIM: {{ .Values.oidc.groupsClaim | default "groups" | quote }}
  OIDC_ADMIN_GROUPS: {{ join "," (.Values.oidc.adminGroups | default list) | quote }}
  OIDC_PUSHER_GROUPS: {{ join "," (.Values.oidc.pusherGroups | default list) | quote }}
  OIDC_READER_GROUPS: {{ join "," (.Values.oidc.readerGroups | default list) | quote }}
  OIDC_DEFAULT_ROLE: {{ .Values.oidc.defaultRole | default "reader" | quote }}
  {{- end }}
  REQUIRE_SIGNED_PUSH: {{ (.Values.signing).enabled | default false | toString | quote }}
  {{- if (.Values.signing).publicKeysSecret }}
  COSIGN_PUBLIC_KEYS_DIR: "/etc/dockyard-cosign-keys"
  {{- end }}
