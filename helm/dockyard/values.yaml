replicaCount: 1

image:
  repository: ghcr.io/kgma74/dockyard
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

registry:
  # embedded: Dockyard is the registry (blobs stored locally or on S3)
  # proxy: Dockyard forwards /v2/* to an upstream registry (registry.proxy.*)
  # mirror: pull-through cache of that upstream, also accepting direct pushes
  mode: embedded

  storage:
    backend: local  # local | s3
    path: /data/registry

  s3:
    endpoint: ""
    bucket: "dockyard-registry"
    region: "us-east-1"
    secure: "true"
    accessKey: ""
    secretKey: ""

  proxy:
    url: ""
    username: ""
    password: ""

auth:
  username: admin
  password: "changeme"
  # Auth on /v2/* endpoints (Docker token auth + Basic fallback).
  # BREAKING: the application default flipped to true with the RBAC release —
  # this chart pins it explicitly. Set to false for an open registry.
  v2Enabled: true
  # Allow unauthenticated pulls while pushes still require login
  # (public-read registry). Only relevant when v2Enabled is true.
  v2AnonymousPull: false
  # JWT secret: auto-generated on first install, preserved across upgrades.
  # Set explicitly to override auto-generation.
  jwtSecret: ""
  # Name of an existing Secret that already contains jwt-secret and auth-password
  # (and optionally s3-access-key, s3-secret-key, registry-password).
  # When set, no Secret is created by this chart.

# Single sign-on with an OpenID Connect provider (Authentik, Keycloak,
# Authelia, Zitadel, Entra ID, Google, Dex…). Register Dockyard as a
# confidential client with the redirect URI
#   https://<your-host>/api/admin/auth/oidc/callback
# Accounts are created on first sign-in; password sign-in keeps working for
# local accounts (the bootstrap admin included).
#
# Not required: SSO can also be set up from the console (Settings → Single
# sign-on), with no redeploy. enabled=true here makes these values the source
# of truth and the console read-only. To configure SSO in the console but keep
# the client secret in Kubernetes, leave enabled=false and set clientSecret
# only (or OIDC_CLIENT_SECRET in auth.existingSecret).
oidc:
  enabled: false
  issuerURL: ""          # e.g. https://auth.example.com/application/o/dockyard/
  clientID: ""
  # Stored in the chart's Secret as OIDC_CLIENT_SECRET. With
  # auth.existingSecret, put it there under that key instead.
  clientSecret: ""
  # Defaults to the callback on the host the browser used; set it when a
  # proxy rewrites the Host header.
  redirectURL: ""
  displayName: "SSO"     # the button reads "Sign in with <displayName>"
  scopes: [openid, profile, email, groups]
  usernameClaim: preferred_username
  groupsClaim: groups
  # Group → role. When any list is set, the role is re-synced from the
  # groups at every sign-in; when all are empty, new accounts get
  # defaultRole and admins manage roles in the UI.
  adminGroups: []
  pusherGroups: []
  readerGroups: []
  # Role of users in none of the groups: reader, pusher, admin, or "none" to
  # refuse them.
  defaultRole: reader

serviceAccount:
  # Create a dedicated ServiceAccount (no extra permissions granted).
  create: true
  # Override the generated name, or set create=false and name to use an
  # existing one ("" + create=false → "default").
  name: ""
  annotations: {}

metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs (kube-prometheus-stack).
    # Dockyard itself serves /metrics whenever METRICS_ENABLED=true.
    enabled: false
    interval: 30s
    # Extra labels for Prometheus instance selection (e.g. release: kps).
    labels: {}

signing:
  # Signed-push enforcement: verifies cosign signatures against configured
  # public keys. Signing itself always happens client-side (cosign CLI) —
  # Dockyard never holds private keys, and does not support keyless
  # (Fulcio/Rekor) verification.
  enabled: false
  # Name of an existing Secret whose keys (one or more *.pem files) get
  # mounted read-only and scanned for public keys to verify against.
  publicKeysSecret: ""

tracing:
  # Distributed tracing (OpenTelemetry). Off by default — leave otlpEndpoint
  # empty and Dockyard adds zero overhead (no middleware installed, global
  # tracer stays a no-op). Set otlpEndpoint to an OTLP/HTTP collector to
  # enable: every request gets a root span, with child spans around the
  # storage operations that matter for push/pull latency. No other config
  # surface exists on purpose.
  otlpEndpoint: ""

scan:
  # Vulnerability scanning: Dockyard shells out to a `trivy` binary bundled in
  # its own image. Standalone by default (empty trivyServerURL): the image
  # ships a vulnerability DB that seeds cacheDir on startup, so the first
  # scan works without internet access. Scans never download a database:
  # Dockyard refreshes the vulnerability DB and the Java DB (images with
  # jars; ~1 GB to download, more once unpacked on the volume — size
  # persistence.size for it) at startup and every 12 hours, unless `offline`
  # is true. Set trivyServerURL to defer to a
  # shared/external `trivy server --listen` deployment instead (mutualized
  # DB across instances) — Dockyard never runs or manages Trivy itself in
  # that case.
  enabled: false
  trivyServerURL: ""
  # Air-gapped clusters: never download the DBs, scan with those shipped in
  # the image (or already cached). The default image ships no Java DB: build
  # one with --build-arg TRIVY_JAVA_DB=true to scan Java images offline.
  offline: false
  # Empty = computed automatically under the storage volume
  # (<registry.storage.path>/trivy-cache). Override only if you need the
  # cache on a different persistent path.
  cacheDir: ""
  timeout: "5m"
  maxReportBytes: 20971520
  dedupWindow: "1h"
  # trivy pulls the scanned image from Dockyard's own /v2 endpoint on
  # localhost, which is plain HTTP unless tls.mode below is set.
  insecureRegistry: true

tls:
  # off | static | self-signed | acme — served natively by Dockyard.
  # "static" expects existingCertSecret below; "acme" needs the pod reachable
  # from the internet on :443 (TLS-ALPN challenge) and domain set.
  mode: "off"
  domain: ""
  acmeEmail: ""
  # kubernetes.io/tls Secret (tls.crt / tls.key) mounted read-only; implies
  # TLS_CERT_FILE/TLS_KEY_FILE when mode=static.
  existingCertSecret: ""
  existingSecret: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # Set className to "traefik" (k3s default) or "nginx".
  # Traefik streams request/response bodies by default — no middleware needed
  # (a buffering Middleware was tried here before but broke large blob PUTs
  # and SSE, since it fully buffers both directions before proxying).
  # For nginx-ingress, set className: "nginx" and add these annotations:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
  #   nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  className: ""
  annotations: {}
  certManager:
    # Cluster-issuer name (e.g. "letsencrypt-prod") — adds the
    # cert-manager.io/cluster-issuer annotation automatically and requires
    # cert-manager to already be installed in the cluster. Leave empty to
    # manage the annotation/secret yourself (or use tls.mode=acme instead,
    # which needs no ingress controller or cert-manager at all).
    clusterIssuer: ""
  hosts:
    - host: registry.example.com
      paths:
        - path: /
          pathType: Prefix
  # With certManager.clusterIssuer set, add a matching entry here so
  # cert-manager knows which Secret to populate, e.g.:
  #   - secretName: dockyard-tls
  #     hosts: [registry.example.com]
  tls: []

# Not supported. Dockyard keeps users, sessions and policies in SQLite on the
# pod's volume, so a second replica would serve a different, divergent copy
# of them. The chart refuses to render with autoscaling.enabled or
# replicaCount > 1, whatever the storage backend.
autoscaling:
  enabled: false

# PodDisruptionBudget — protects against voluntary disruptions (node drains,
# cluster upgrades) evicting too many replicas at once. Only one of
# minAvailable/maxUnavailable should be set; minAvailable takes precedence.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Liveness/readiness probe tuning. Defaults match what the chart has always
# used; override for slower storage backends (S3) or resource-constrained
# nodes where the defaults are too aggressive.
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

# Persistent volume mounted at registry.storage.path, for both backends.
# - local: holds the images AND Dockyard's state.
# - s3: images go to the bucket; the volume holds Dockyard's state only —
#   users, sessions, policies, audit log (SQLite), the Trivy cache and ACME
#   certificates. 1–2Gi is plenty without scanning; with scan.enabled keep a
#   few Gi for the Trivy databases (the Java DB alone is ~1 GB to download,
#   larger unpacked) — the default 10Gi covers it.
# Disabling it makes all of that ephemeral: users created in the UI vanish
# on every pod restart.
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  existingClaim: ""

resources: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
