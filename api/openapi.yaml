openapi: 3.0.3
info:
  title: Dockyard Admin API
  description: |
    Administration API of Dockyard, a self-hosted Docker Registry V2.

    Authentication: obtain an access token (15 min) plus a rotating refresh
    token via `POST /api/admin/auth/login`, then send
    `Authorization: Bearer <token>`. The registry protocol itself lives under
    `/v2/*` (Docker Registry HTTP API V2) and authenticates through
    `GET /v2/token` (Docker token auth) — only the token endpoint is described
    here.

    Roles: `admin` (everything), `pusher` (pull + push), `reader` (read-only).
    Endpoints marked *admin only* return `403` for other roles.
  version: "1.0"
  license:
    name: MIT
servers:
  - url: /
tags:
  - name: auth
  - name: users
  - name: sessions
  - name: repositories
  - name: storage
  - name: retention
  - name: webhooks
  - name: scan
  - name: signing
  - name: quota
  - name: replication
  - name: audit
  - name: system

security:
  - bearerAuth: []

paths:
  /api/admin/auth/login:
    post:
      tags: [auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Access + refresh tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Rate limited (RATE_LIMIT_LOGIN_PER_MIN) }

  /api/admin/auth/refresh:
    post:
      tags: [auth]
      summary: Renew the access token
      description: Refresh tokens are single-use — each call rotates it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Fresh access + refresh tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: Revokes the access token (persisted) and kills the session.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/auth/oidc:
    get:
      tags: [auth]
      summary: Whether single sign-on is configured (public)
      security: []
      responses:
        "200":
          description: SSO availability, for the login page
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  name: { type: string, description: Provider label for the sign-in button }

  /api/admin/auth/oidc/login:
    get:
      tags: [auth]
      summary: Start an SSO sign-in (browser navigation)
      description: >
        Redirects to the provider (authorization code flow with PKCE, state and nonce).
        `return` is the path to land on afterwards; anything but a local path is ignored.
      security: []
      parameters:
        - { name: return, in: query, schema: { type: string, example: /images } }
      responses:
        "302": { description: Redirect to the identity provider }
        "404": { description: SSO is not configured }

  /api/admin/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Provider callback (browser navigation)
      description: >
        Redirects to `/login#oidc_code=<one-time code>&return=<path>` on success, or
        `/login#oidc_error=<reason>` (provider_denied, expired, provider_unreachable, exchange_failed,
        invalid_token, not_allowed, username_invalid, username_taken, session_failed).
      security: []
      responses:
        "302": { description: Back to the console }

  /api/admin/auth/oidc/exchange:
    post:
      tags: [auth]
      summary: Trade the one-time sign-in code for session tokens
      description: The code is valid for one minute and a single use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Session tokens, as for a password login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { description: Code expired or already used }

  /api/admin/auth/me:
    get:
      tags: [auth]
      summary: The signed-in account
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/admin/auth/cli-secret:
    post:
      tags: [auth]
      summary: Issue a CLI secret for docker login
      description: >
        A generated secret the account can use as its docker login password (the only way for an
        SSO account, which has no password). Replaces any previous one; shown once.
      responses:
        "201":
          description: The secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  secret: { type: string, example: dkc_… }
    delete:
      tags: [auth]
      summary: Revoke the CLI secret
      responses:
        "200": { description: Revoked }

  /api/admin/auth/password:
    post:
      tags: [auth]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/users:
    get:
      tags: [users]
      summary: List users (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
                role: { $ref: "#/components/schemas/Role" }
                repo_patterns:
                  type: array
                  items: { type: string }
                  description: Repo globs restricting the account ('*' crosses '/').
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Username already exists }

  /api/admin/robots:
    get:
      tags: [users]
      summary: List robot accounts (admin only)
      responses:
        "200":
          description: Robot accounts (secrets are never listed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  robots:
                    type: array
                    items: { $ref: "#/components/schemas/Robot" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Create a robot account (admin only)
      description: >
        Robot accounts authenticate to the registry protocol only (`docker login -u robot+<name>`),
        never to the admin API, and cannot delete. The secret is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*$", maxLength: 64 }
                description: { type: string, maxLength: 200 }
                role: { type: string, enum: [pusher, reader] }
                repo_patterns:
                  type: array
                  items: { type: string }
                expires_in_days: { type: integer, minimum: 0, maximum: 3650, description: "0 = never expires" }
      responses:
        "201":
          description: Created robot, with its secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobotWithSecret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Name already taken }

  /api/admin/robots/{id}/secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [users]
      summary: Issue a new secret (admin only)
      description: The previous secret stops working immediately.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days: { type: integer, minimum: 0, maximum: 3650 }
      responses:
        "200":
          description: Robot with its new secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RobotWithSecret" }
        "404": { description: Robot not found }

  /api/admin/robots/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [users]
      summary: Delete a robot account (admin only)
      description: Registry tokens already issued to it are refused from the next request.
      responses:
        "200": { description: Deleted }
        "404": { description: Robot not found }

  /api/admin/users/{username}:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    put:
      tags: [users]
      summary: Update role, patterns and/or password (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                repo_patterns:
                  type: array
                  items: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid change (e.g. demoting the last admin) }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: Delete a user (admin only)
      description: Self-deletion and removing the last admin are refused.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { description: Refused (own account or last admin) }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/sessions:
    get:
      tags: [sessions]
      summary: List active sessions (admin only)
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  count: { type: integer }
                  current_id:
                    type: integer
                    description: Session id of the caller.
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/sessions/{id}:
    delete:
      tags: [sessions]
      summary: Revoke a session (admin only)
      description: Kills the refresh token; access tokens of that session are rejected on their next request.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/sessions/mine:
    get:
      tags: [sessions]
      summary: List the caller's own sessions (any signed-in user)
      responses:
        "200":
          description: Sessions of the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
                  count: { type: integer }
                  current_id: { type: integer, description: Session id of this request. }

  /api/admin/sessions/mine/{id}:
    delete:
      tags: [sessions]
      summary: Sign out one of the caller's own sessions
      description: Another user's session id answers 404, like a missing one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/sso:
    get:
      tags: [auth]
      summary: Single sign-on configuration (admin only)
      description: >
        The client secret is never returned: client_secret_set tells whether one is stored.
        managed_by=env means the deployment sets OIDC_ISSUER_URL and the configuration is read-only here.
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [auth]
      summary: Save and apply the single sign-on configuration (admin only)
      description: Applied at once, without a restart. Refused (409) when the deployment manages SSO.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOSettingsInput" }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Single sign-on is configured by the deployment (OIDC_ISSUER_URL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/sso/test:
    post:
      tags: [auth]
      summary: Run OpenID discovery against an issuer (admin only)
      description: Without issuer_url, tests the active configuration. A failed discovery still answers 200 with ok=false.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                issuer_url: { type: string, format: uri }
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/vulnerabilities:
    get:
      tags: [scan]
      summary: Registry-wide vulnerability overview (admin only, scanning on)
      description: >-
        The latest successful scan of every scanned image, most critical
        first, with whether the vulnerability policy blocks its pull; and
        the vulnerabilities found in those images, most severe and most
        widespread first (at most 500; cve_count is the total), each with
        the scans it appears in and whether it is on the active allowlist.
        Images deleted since their scan are left out. 404 when scanning is off.
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        scan_id: { type: integer }
                        name: { type: string }
                        reference: { type: string }
                        digest: { type: string }
                        trivy_version: { type: string }
                        critical_count: { type: integer }
                        high_count: { type: integer }
                        medium_count: { type: integer }
                        low_count: { type: integer }
                        unknown_count: { type: integer }
                        finished_at: { type: string, format: date-time }
                        pull_blocked: { type: boolean }
                  cves:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN] }
                        scan_ids: { type: array, items: { type: integer } }
                        allowlisted: { type: boolean }
                  cve_count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/setup:
    get:
      tags: [system]
      summary: Getting-started checklist (admin only)
      description: >-
        Steps an admin should take on a new install, each ticked from the
        instance's actual state. Steps that do not apply here are left out
        (first_image in proxy mode, scan_on_push with scanning off).
      responses:
        "200":
          description: The checklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      required: [id, done]
                      properties:
                        id: { type: string, enum: [admin_password, first_image, robot_account, scan_on_push, team, https] }
                        done: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/config:
    get:
      tags: [system]
      summary: Effective server configuration (admin only)
      description: >
        Grouped settings with the environment variable controlling each one.
        Never includes passwords, keys, JWT secrets or S3 credentials;
        credentials embedded in URLs are removed.
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [registry, access, security, maintenance, observability] }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              value: { description: "boolean, number, string or string array" }
                              env: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/repositories:
    get:
      tags: [repositories]
      summary: List repositories with tags and last push time
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        tags: { type: array, items: { type: string } }
                        total: { type: integer }
                        last_pushed: { type: string, format: date-time }
                  total: { type: integer }
    delete:
      tags: [repositories]
      summary: Delete a repository and all its tags (admin only)
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/repositories/tags:
    get:
      tags: [repositories]
      summary: List tags of a repository with size, platforms, signature and latest scan
      description: >
        Each tag is resolved on the server (up to 8 at a time), so the list
        can be compared at a glance without one request per tag. Optional
        fields are absent when unknown — e.g. `signed` without cosign keys,
        `scan` for a digest never scanned — never filled with a guess.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/TagSummary" }
                  total: { type: integer }

  /api/admin/repositories/manifest:
    get:
      tags: [repositories]
      summary: Manifest details (size, layers, platforms)
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: reference, in: query, required: true, schema: { type: string }, description: Tag or digest }
      responses:
        "200":
          description: Manifest details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManifestDetails" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/repositories/diff:
    get:
      tags: [repositories]
      summary: Compare layers/config between two tags or digests of the same image
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: reference_a, in: query, required: true, schema: { type: string }, description: Tag or digest }
        - { name: reference_b, in: query, required: true, schema: { type: string }, description: Tag or digest }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagDiff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/repositories/search:
    get:
      tags: [repositories]
      summary: Search repo:tag pairs by name/tag substring, optionally filtered by signed status
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive substring match on repo name or tag }
        - { name: signed, in: query, schema: { type: string, enum: ["true", "false"] }, description: Only present when cosign public keys are configured }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                  total: { type: integer }
                  count: { type: integer }

  /api/admin/repositories/layer:
    get:
      tags: [repositories]
      summary: List the files inside a layer (gzip, zstd or plain tar)
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: digest, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Layer entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  digest: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        type: { type: string, enum: [file, dir, symlink, hardlink, other] }
                        size: { type: integer }
                        size_human: { type: string }
                        mode: { type: string }
                        link_name: { type: string }
                  count: { type: integer }

  /api/admin/repositories/manifests:
    delete:
      tags: [repositories]
      summary: Delete a manifest (admin only)
      description: Removes the manifest and every tag pointing at its digest.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: digest, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/repositories/export:
    get:
      tags: [repositories]
      summary: Export a repository as an OCI image-layout tarball (admin only)
      description: Interoperates with skopeo/crane. Each tag becomes an index.json entry.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tar stream
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/repositories/import:
    post:
      tags: [repositories]
      summary: Import an OCI image-layout tarball into a repository (admin only)
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  tags: { type: integer }
        "400": { description: Not an OCI image layout }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/storage/stats:
    get:
      tags: [storage]
      summary: Storage usage
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_size_bytes: { type: integer }
                  total_size_human: { type: string }
                  blob_count: { type: integer }
                  repo_count: { type: integer }
                  storage_path: { type: string }
        "501": { description: Not available in proxy mode }

  /api/admin/storage/tree:
    get:
      tags: [storage]
      summary: Raw filesystem tree (local backend only)
      responses:
        "200": { description: File list }
        "501": { description: Not available (proxy mode or S3 backend) }

  /api/admin/gc:
    post:
      tags: [storage]
      summary: Garbage-collect unreferenced blobs (admin only)
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean }
          description: Report what would be removed without deleting.
      responses:
        "200":
          description: GC result
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: array, items: { type: string } }
                  count: { type: integer }
                  freed_bytes: { type: integer }
                  freed_human: { type: string }
                  dry_run: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { description: Not available in proxy mode }

  /api/admin/insights:
    get:
      tags: [storage]
      summary: Growth history and largest repositories (admin only)
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        total_size: { type: integer }
                        blob_count: { type: integer }
                        repo_count: { type: integer }
                  top_repos:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size_bytes: { type: integer }
                        size_human: { type: string }
                        tags: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/retention:
    get:
      tags: [retention]
      summary: List retention policies (admin only)
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/RetentionPolicy" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [retention]
      summary: Create a retention policy (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionPolicyInput" }
      responses:
        "201":
          description: Created policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/retention/{id}:
    delete:
      tags: [retention]
      summary: Delete a retention policy (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/retention/run:
    post:
      tags: [retention]
      summary: Evaluate (and optionally apply) the retention plan (admin only)
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean }
          description: Preview the plan without deleting anything.
      responses:
        "200":
          description: Plan and outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: object
                    properties:
                      delete:
                        type: array
                        items:
                          type: object
                          properties:
                            repo: { type: string }
                            tag: { type: string }
                            digest: { type: string }
                            reason: { type: string }
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            repo: { type: string }
                            tag: { type: string }
                            reason: { type: string }
                  dry_run: { type: boolean }
                  deleted: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks (admin only)
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [webhooks]
      summary: Create a webhook (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                secret:
                  type: string
                  description: HMAC-SHA256 signing secret for X-Dockyard-Signature.
                events:
                  type: array
                  items: { type: string, enum: [push, delete, retention, gc, scan, import, quota_warning] }
                format: { type: string, enum: [generic, slack, discord] }
      responses:
        "201":
          description: Created webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/webhooks/{id}:
    delete:
      tags: [webhooks]
      summary: Delete a webhook (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/webhooks/{id}/test:
    post:
      tags: [webhooks]
      summary: Send a synchronous test event (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Endpoint rejected the delivery }

  /api/admin/scans:
    get:
      tags: [scan]
      summary: List vulnerability scans, newest first (admin only)
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: digest, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Scans
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans:
                    type: array
                    items: { $ref: "#/components/schemas/ScanResult" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [scan]
      summary: Trigger a vulnerability scan for an image (admin only)
      description: |
        Requires SCAN_ENABLED. Dockyard shells out to the `trivy` binary bundled
        in its own image; the vulnerability DB is shipped in the image and
        refreshed on startup (standalone mode, the default). Set TRIVY_SERVER_URL
        to defer to a shared external trivy server, or TRIVY_OFFLINE=true for
        air-gapped hosts. Scans run asynchronously — poll GET
        /api/admin/scans/{id} for the outcome. A recent successful scan for the
        same resolved digest is reused instead of re-scanning (see `cached` in
        the response).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reference]
              properties:
                name: { type: string }
                reference:
                  type: string
                  description: Tag or digest to scan.
      responses:
        "202":
          description: Scan queued (or a cached result reused)
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan: { $ref: "#/components/schemas/ScanResult" }
                  cached: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Manifest not found }

  /api/admin/scans/{id}:
    get:
      tags: [scan]
      summary: Get a scan's status and severity counts (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Scan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/scans/{id}/report:
    get:
      tags: [scan]
      summary: Get or download the report of a scan (admin only)
      description: >-
        Without `format`, returns the raw trivy JSON report inline. With
        `format`, returns it as a download (`Content-Disposition: attachment`,
        named after the image): `json` is the same raw report, `csv` lists
        the findings one per row (most severe first, with whether each CVE
        is on the active allowlist), `pdf` is a printable report.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv, pdf] }
        - name: lang
          in: query
          required: false
          description: Language of the PDF report (default en).
          schema: { type: string, enum: [en, fr] }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/vulnerability-policy:
    get:
      tags: [scans]
      summary: Vulnerability policy and CVE allowlist (admin only)
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  policy: { $ref: "#/components/schemas/VulnerabilityPolicy" }
                  allowlist:
                    type: array
                    items: { $ref: "#/components/schemas/AllowedCVE" }
                  scanning_enabled: { type: boolean, description: "False when SCAN_ENABLED is off: nothing is enforced." }
    put:
      tags: [scans]
      summary: Update the vulnerability policy (admin only)
      description: >
        Blocked pulls answer 403 DENIED with the offending CVEs and are recorded in the audit log
        (action pull-blocked). Dockyard's own scanner is exempt so blocked images can be re-scanned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scan_on_push: { type: boolean }
                block_severity: { type: string, enum: ["", CRITICAL, HIGH, MEDIUM, LOW] }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnerabilityPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/vulnerability-policy/allowlist:
    post:
      tags: [scans]
      summary: Accept a vulnerability (admin only)
      description: An allowlisted vulnerability never blocks a pull, until the entry expires. Adding an existing ID updates it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cve_id]
              properties:
                cve_id: { type: string, example: CVE-2024-3094 }
                reason: { type: string, maxLength: 500 }
                expires_in_days: { type: integer, minimum: 0, maximum: 3650, description: "0 = never expires" }
      responses:
        "201": { description: Added }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/vulnerability-policy/allowlist/{cve}:
    parameters:
      - { name: cve, in: path, required: true, schema: { type: string } }
    delete:
      tags: [scans]
      summary: Remove an exception (admin only)
      responses:
        "200": { description: Removed }
        "404": { description: Not on the allowlist }

  /api/admin/signing:
    get:
      tags: [signing]
      summary: Signed-push status — global default and configured key count (admin only)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, description: REQUIRE_SIGNED_PUSH global default }
                  keys_loaded: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/signing/policies:
    get:
      tags: [signing]
      summary: List per-repository signed-push overrides (admin only)
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/SigningPolicy" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [signing]
      summary: Create a signed-push override for a repository pattern (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo_pattern: { type: string, default: "*" }
                required: { type: boolean }
      responses:
        "201":
          description: Created policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/signing/policies/{id}:
    delete:
      tags: [signing]
      summary: Delete a signed-push override (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/quotas:
    get:
      tags: [quota]
      summary: List configured byte quotas and current usage per scope (admin only)
      responses:
        "200":
          description: Quotas and usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotas:
                    type: array
                    items: { $ref: "#/components/schemas/Quota" }
                  usage:
                    type: array
                    items: { $ref: "#/components/schemas/QuotaUsage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [quota]
      summary: Create or update a byte quota for a repo or user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_type, scope_value, max_bytes]
              properties:
                scope_type: { type: string, enum: [repo, user] }
                scope_value: { type: string }
                max_bytes: { type: integer, format: int64 }
                warn_percent: { type: integer, default: 90 }
      responses:
        "200":
          description: Quota
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quota" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/quotas/{id}:
    delete:
      tags: [quota]
      summary: Delete a quota (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/quotas/usage/reset:
    post:
      tags: [quota]
      summary: Reset recorded usage for one scope (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_type, scope_value]
              properties:
                scope_type: { type: string, enum: [repo, user] }
                scope_value: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/replication/targets:
    get:
      tags: [replication]
      summary: List replication targets (admin only, embedded/mirror mode)
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items: { $ref: "#/components/schemas/ReplicationTarget" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [replication]
      summary: Create a replication target (admin only, embedded/mirror mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_url]
              properties:
                name: { type: string }
                base_url: { type: string }
                username: { type: string }
                password: { type: string }
                repo_pattern: { type: string, default: "*" }
      responses:
        "201":
          description: Created target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/replication/targets/{id}:
    delete:
      tags: [replication]
      summary: Delete a replication target (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/replication/targets/{id}/test:
    post:
      tags: [replication]
      summary: Ping a replication target to check reachability (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: Target unreachable }

  /api/admin/audit:
    get:
      tags: [audit]
      summary: Audit trail, newest first (admin only)
      parameters:
        - { name: repo, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/events:
    get:
      tags: [system]
      summary: Server-sent events feed of registry activity
      description: |
        SSE stream (`text/event-stream`). EventSource cannot set headers, so
        the JWT may be passed as the `token` query parameter instead.
      parameters:
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200": { description: "SSE stream of events: push, delete, retention, gc, scan, import" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /health:
    get:
      tags: [system]
      summary: Health check
      security: []
      responses:
        "200":
          description: Status (degraded when the storage probe fails)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  mode: { type: string, enum: [embedded, proxy, mirror] }
                  version: { type: string }
                  registry: { type: string, description: Upstream URL or unreachable error (proxy/mirror) }
                  storage:
                    type: object
                    properties:
                      ok: { type: boolean }
                      latency_ms: { type: integer }
                      blobs: { type: integer }
                      bytes: { type: integer }
                      repositories: { type: integer }
                      free_bytes: { type: integer }
                  mirror:
                    type: object
                    properties:
                      hits: { type: integer }
                      misses: { type: integer }

  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics (when METRICS_ENABLED)
      security: []
      responses:
        "200": { description: Prometheus exposition format }

  /v2/token:
    get:
      tags: [auth]
      summary: Docker registry token endpoint
      description: |
        Trades Basic credentials (any user account) for a short-lived JWT used
        against `/v2/*`. With `V2_ANONYMOUS_PULL`, anonymous requests get a
        pull-only token.
      security: []
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string }, example: "repository:team/app:pull,push" }
      responses:
        "200":
          description: Registry token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  access_token: { type: string }
                  expires_in: { type: integer }
                  issued_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Rate limited }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Message:
      description: Success message
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or revoked credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Requires the admin role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Role:
      type: string
      enum: [admin, pusher, reader]

    AuthTokens:
      type: object
      properties:
        token: { type: string, description: JWT access token (15 min) }
        refresh_token: { type: string, description: Single-use refresh token (30 days) }
        role: { $ref: "#/components/schemas/Role" }
        expires_in: { type: integer, example: 900 }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        repo_patterns:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        auth_source: { type: string, enum: [local, oidc], description: "oidc accounts sign in through SSO and have no password" }
        has_cli_secret: { type: boolean }

    Robot:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        username: { type: string, description: "Registry login: robot+<name>" }
        description: { type: string }
        role: { type: string, enum: [pusher, reader] }
        repo_patterns:
          type: array
          items: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }

    RobotWithSecret:
      allOf:
        - $ref: "#/components/schemas/Robot"
        - type: object
          properties:
            secret: { type: string, description: "Shown once. Use as the password of docker login." }

    Session:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    ManifestDetails:
      type: object
      properties:
        digest: { type: string }
        media_type: { type: string }
        total_size_bytes: { type: integer }
        total_size_human: { type: string }
        config_digest: { type: string }
        created: { type: string, format: date-time }
        architecture: { type: string }
        os: { type: string }
        variant: { type: string, description: "CPU variant, e.g. v7 for linux/arm/v7" }
        signed:
          type: boolean
          description: >
            Present only when cosign public keys are configured. True if a
            valid cosign signature was found for this digest.
        layers:
          type: array
          items:
            type: object
            properties:
              digest: { type: string }
              size_bytes: { type: integer }
              size_human: { type: string }
        history:
          type: array
          description: >
            Build steps from the image config, base first. Steps that
            produced a layer carry its digest and size — only when the number
            of layer-producing steps matches the number of layers, so a
            squashed image is never mislabelled.
          items:
            type: object
            properties:
              created_by: { type: string, example: "RUN /bin/sh -c apk add curl # buildkit" }
              created: { type: string, format: date-time }
              empty_layer: { type: boolean }
              layer_digest: { type: string }
              size_bytes: { type: integer }
        platforms:
          type: array
          items:
            type: object
            properties:
              architecture: { type: string }
              os: { type: string }
              variant: { type: string }
              digest: { type: string }
              size_bytes: { type: integer }
              size_human: { type: string }

    TagSummary:
      type: object
      required: [tag, digest]
      properties:
        tag: { type: string }
        digest: { type: string }
        pushed_at: { type: string, format: date-time, description: Embedded mode only }
        size_bytes: { type: integer, description: Compressed size; the sum of all platforms for a multi-arch image }
        platforms:
          type: array
          items: { type: string, example: linux/arm64 }
          description: Runnable platforms; attestation entries (unknown/unknown) are left out.
        signed: { type: boolean, description: Present only when cosign public keys are configured. }
        scan:
          type: object
          description: Latest scan of this digest; absent if never scanned.
          properties:
            id: { type: integer, description: "The scan, to fetch its report" }
            trivy_version: { type: string }
            status: { type: string, enum: [queued, running, succeeded, failed] }
            critical_count: { type: integer }
            high_count: { type: integer }
            medium_count: { type: integer }
            low_count: { type: integer }
            unknown_count: { type: integer }
        pull_blocked:
          type: boolean
          description: The vulnerability policy refuses docker pull of this tag. Absent when false.

    SSOSettingsInput:
      type: object
      properties:
        enabled: { type: boolean }
        issuer_url: { type: string, format: uri, description: "Required to enable. Absolute http(s) URL without credentials." }
        client_id: { type: string, description: Required to enable. }
        client_secret:
          type: string
          description: >
            Absent keeps the stored secret, empty removes it. Stored encrypted (AES-256-GCM, key derived
            from JWT_SECRET). Refused when OIDC_CLIENT_SECRET is set by the deployment.
        redirect_url: { type: string, description: "Exact callback URL registered at the provider; empty = derived from the request." }
        display_name: { type: string, maxLength: 40, description: 'The button reads "Sign in with <display_name>".' }
        scopes: { type: array, items: { type: string }, description: openid is always added. }
        username_claim: { type: string }
        groups_claim: { type: string }
        admin_groups: { type: array, items: { type: string } }
        pusher_groups: { type: array, items: { type: string } }
        reader_groups: { type: array, items: { type: string } }
        default_role: { type: string, enum: [reader, pusher, admin, none] }

    SSOSettings:
      type: object
      required: [managed_by, enabled, issuer_url, client_id, client_secret_set, client_secret_from_env, callback_url,
        display_name, scopes, username_claim, groups_claim, admin_groups, pusher_groups, reader_groups, default_role]
      properties:
        managed_by:
          type: string
          enum: [env, console]
          description: env = set by OIDC_* variables and read-only here.
        enabled: { type: boolean }
        issuer_url: { type: string }
        client_id: { type: string }
        client_secret_set: { type: boolean }
        client_secret_from_env: { type: boolean, description: The secret comes from OIDC_CLIENT_SECRET. }
        redirect_url: { type: string }
        callback_url: { type: string, description: The redirect URI to register at the provider. }
        display_name: { type: string }
        scopes: { type: array, items: { type: string } }
        username_claim: { type: string }
        groups_claim: { type: string }
        admin_groups: { type: array, items: { type: string } }
        pusher_groups: { type: array, items: { type: string } }
        reader_groups: { type: array, items: { type: string } }
        default_role: { type: string, enum: [reader, pusher, admin, none] }
        updated_by: { type: string }
        updated_at: { type: string }
        error: { type: string, description: Why an enabled configuration is not active. }

    SSOTestResult:
      type: object
      required: [ok, issuer]
      properties:
        ok: { type: boolean }
        issuer: { type: string }
        error: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        userinfo_endpoint: { type: string }
        scopes_supported: { type: array, items: { type: string } }
        claims_supported: { type: array, items: { type: string } }

    VulnerabilityPolicy:
      type: object
      properties:
        scan_on_push: { type: boolean, description: Queue a scan for every pushed tag. }
        block_severity:
          type: string
          enum: ["", CRITICAL, HIGH, MEDIUM, LOW]
          description: >
            Refuse manifest GETs of images whose latest scan has a vulnerability at this severity or above
            that the allowlist does not cover. Empty = never block. Unscanned images are not blocked.
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }

    AllowedCVE:
      type: object
      properties:
        cve_id: { type: string, example: CVE-2024-3094 }
        reason: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    SearchResult:
      type: object
      properties:
        name: { type: string }
        tag: { type: string }
        digest: { type: string }
        pushed_at: { type: string, format: date-time }
        signed:
          type: boolean
          description: Present only when cosign public keys are configured.
        scan:
          type: object
          nullable: true
          description: Present only when a scan has completed for this digest.
          properties:
            status: { type: string, enum: [queued, running, succeeded, failed] }
            critical_count: { type: integer }
            high_count: { type: integer }

    TagDiff:
      type: object
      properties:
        a: { $ref: "#/components/schemas/ManifestDetails" }
        b: { $ref: "#/components/schemas/ManifestDetails" }
        layers_only_a:
          type: array
          items: { type: string }
        layers_only_b:
          type: array
          items: { type: string }
        layers_common:
          type: array
          items: { type: string }
        size_delta_bytes:
          type: integer
          description: b's total size minus a's.

    RetentionPolicyInput:
      type: object
      properties:
        repo_pattern: { type: string, default: "*" }
        keep_n: { type: integer, description: Keep the N most recently pushed tags (0 = off) }
        unpulled_days: { type: integer, description: Delete tags unpulled for N days (0 = off) }
        keep_patterns:
          type: array
          items: { type: string }
          description: Tag globs always kept (only '*' is special).
        protected_tags:
          type: array
          items: { type: string }

    RetentionPolicy:
      allOf:
        - $ref: "#/components/schemas/RetentionPolicyInput"
        - type: object
          properties:
            id: { type: integer }
            enabled: { type: boolean }
            created_at: { type: string, format: date-time }

    Webhook:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string, enum: [push, delete, retention, gc, scan, import, quota_warning] }
        format: { type: string, enum: [generic, slack, discord] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    SigningPolicy:
      type: object
      properties:
        id: { type: integer }
        repo_pattern: { type: string }
        required: { type: boolean }
        created_at: { type: string, format: date-time }

    Quota:
      type: object
      properties:
        id: { type: integer }
        scope_type: { type: string, enum: [repo, user] }
        scope_value: { type: string }
        max_bytes: { type: integer, format: int64 }
        warn_percent: { type: integer }
        created_at: { type: string, format: date-time }

    QuotaUsage:
      type: object
      properties:
        scope_type: { type: string, enum: [repo, user] }
        scope_value: { type: string }
        bytes_used: { type: integer, format: int64 }

    ReplicationTarget:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        base_url: { type: string }
        username: { type: string }
        repo_pattern: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    ScanResult:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        reference: { type: string }
        digest: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        requested_by: { type: string }
        trivy_version: { type: string }
        critical_count: { type: integer }
        high_count: { type: integer }
        medium_count: { type: integer }
        low_count: { type: integer }
        unknown_count: { type: integer }
        error: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        repo: { type: string }
        tag: { type: string }
        source_ip: { type: string }
        result: { type: string }
        details: { type: string }
